<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ROSEDAYS — Fondo Story</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#3a3a3a}
.story{width:1080px;height:1920px;position:relative;overflow:hidden;background:#1D1C1B}
.glow-dark{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 75% 12%,rgba(168,156,247,.3),rgba(168,156,247,0)),
    radial-gradient(circle at 20% 90%,rgba(168,156,247,.16),rgba(168,156,247,0));
}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:overlay}
.grain canvas{width:100%;height:100%;display:block}
</style>
</head>
<body>
<section class="story" id="bg">
  <div class="glow-dark"></div>
  <div class="grain"><canvas id="noise" width="270" height="480"></canvas></div>
</section>
<script>
  const c = document.getElementById('noise');
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(c.width, c.height);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v; img.data[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
</script>
</body>
</html>
